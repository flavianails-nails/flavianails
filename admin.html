<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agenda — Flávia Nails</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-body">
    <header class="admin-top">
      <div class="admin-brand">
        <img src="assets/logo.jpg" alt="" width="44" height="44" />
        <div>
          <strong>Agenda da Flávia</strong>
          <span id="quem"></span>
        </div>
      </div>
      <button type="button" id="sair" class="btn-ghost" hidden>Sair</button>
    </header>

    <main class="admin-main">
      <!-- Aviso quando o Supabase ainda não foi configurado -->
      <section id="tela-desligado" class="card admin-card" hidden>
        <h2 class="card-title">Agenda ainda não conectada</h2>
        <p class="admin-p">
          O banco de dados não está configurado. Preencha <code>supabase.url</code> e
          <code>supabase.anonKey</code> no arquivo <code>config.js</code> e publique de novo.
        </p>
      </section>

      <!-- Login -->
      <section id="tela-login" class="card admin-card" hidden>
        <h2 class="card-title">Entrar</h2>
        <form id="form-login" class="fields" style="margin-top: 1.5rem">
          <label class="field">
            <span class="field-label">E-mail</span>
            <input id="email" class="input" type="email" autocomplete="username" required />
          </label>
          <label class="field">
            <span class="field-label">Senha</span>
            <input
              id="senha"
              class="input"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit" class="btn-primary btn-block" id="btn-entrar">Entrar</button>
          <p class="admin-erro" id="erro-login" hidden></p>
        </form>
      </section>

      <!-- Agenda -->
      <section id="tela-agenda" hidden>
        <div class="card admin-card">
          <div class="admin-card-head">
            <h2 class="card-title">Dia</h2>
            <div class="admin-nav-dia">
              <button type="button" class="btn-ghost" id="dia-anterior" aria-label="Dia anterior">
                ‹
              </button>
              <input id="dia" class="input admin-dia" type="date" />
              <button type="button" class="btn-ghost" id="dia-seguinte" aria-label="Próximo dia">
                ›
              </button>
            </div>
          </div>
          <p class="admin-p" id="resumo-dia"></p>
          <ul class="admin-slots" id="slots"></ul>
        </div>

        <div class="card admin-card">
          <h2 class="card-title">Próximos agendamentos</h2>
          <ul class="admin-proximos" id="proximos"></ul>
        </div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="db.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
